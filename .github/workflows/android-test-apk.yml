name: Build Android Test APK

on:
  push:
    branches: [ android-test-apk ]
    paths:
      - 'android-build/**'
      - '.github/workflows/android-test-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore project
        run: |
          mkdir -p build-src
          base64 -d android-build/UniversalMediaSaver_TestApp.zip.b64 > build-src/app.zip
          cd build-src
          unzip -q app.zip
          echo "Project restored"
          find . -maxdepth 3 -name settings.gradle -print

      - name: Build debug APK
        run: |
          cd build-src/UniversalMediaSaver_TestApp
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp build-src/UniversalMediaSaver_TestApp/app/build/outputs/apk/debug/app-debug.apk apk-output/UniversalMediaSaver-Test.apk
          ls -lh apk-output/UniversalMediaSaver-Test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalMediaSaver-Test-APK
          path: apk-output/UniversalMediaSaver-Test.apk
          if-no-files-found: error
          retention-days: 7

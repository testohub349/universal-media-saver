name: Build Android Test APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-build/**'
      - '.github/workflows/android-test-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore project
        run: |
          mkdir -p build-src
          git fetch origin android-test-apk
          git show origin/android-test-apk:android-build/UniversalMediaSaver_TestApp.zip.b64 | base64 -d > build-src/app.zip
          cd build-src && unzip -q app.zip
      - name: Build APK
        run: |
          cd build-src/UniversalMediaSaver_TestApp
          gradle --no-daemon clean assembleDebug --stacktrace
      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp build-src/UniversalMediaSaver_TestApp/app/build/outputs/apk/debug/app-debug.apk apk-output/UniversalMediaSaver-Test.apk
          ls -lh apk-output/UniversalMediaSaver-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalMediaSaver-Test-APK
          path: apk-output/UniversalMediaSaver-Test.apk
          if-no-files-found: error
          retention-days: 7

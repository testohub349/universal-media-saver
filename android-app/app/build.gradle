plugins {
    id 'com.android.application'
}

android {
    namespace 'com.universalmediasaver.test'
    compileSdk 36

    defaultConfig {
        applicationId "com.universalmediasaver.test"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0-test"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
